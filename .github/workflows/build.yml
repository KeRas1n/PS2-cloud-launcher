name: Build desktop releases
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Official binary and transfer integration
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npm run test:integration
      - name: Linux smoke test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1
      - name: Windows desktop smoke test
        if: runner.os == 'Windows'
        run: npm run test:smoke
      - name: Linux desktop smoke test
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:smoke
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package Linux
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Bundled cloud and two-device integration
        run: npm run test:cloud
      - uses: actions/upload-artifact@v4
        with:
          name: ps2-cloud-${{ runner.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ runner.os }}
          path: test-results/*.png
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ps2-cloud-*
          merge-multiple: true
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --draft --generate-notes --title "PS2 Cloud Launcher $GITHUB_REF_NAME"
